name: Publicar posts da Hana

# Roda a cada 30 min: sincroniza aprovações, avisa pendentes e publica o que venceu.
# Também pode ser disparado na mão em Actions -> Run workflow.
on:
  schedule:
    # O cron do GitHub é BEST-EFFORT: em repositório público ele atrasa e às
    # vezes PULA rodadas sob carga. Medido em 31/07/2026 — quase 3 horas sem
    # nenhuma rodada agendada, e o post das 21:00Z só saiu porque houve um
    # disparo manual. Duas defesas:
    - cron: "*/30 * * * *"          # o batimento normal
    # e uma salva de tentativas coladas no horário de publicação (21:00Z de
    # segunda, quarta e sexta). Se uma for pulada, as outras cobrem. O run.py é
    # idempotente: só publica o que está 'approved' e venceu, então repetir a
    # tentativa não duplica post.
    - cron: "0,7,14,21,28,35 21 * * 1,3,5"
  workflow_dispatch:
    inputs:
      forcar_reporte:
        description: "Mandar a pauta da reunião agora, mesmo não sendo segunda"
        type: boolean
        default: false
      recado:
        description: "Recado do Claude pro Telegram do Ramón (deixe vazio pra não mandar nada)"
        type: string
        default: ""

# Permite que o job faça commit de volta (status dos posts, arquivamento).
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: hana-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar publicador
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_BASE: ${{ vars.GRAPH_BASE || 'https://graph.instagram.com/v21.0' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
          REQUIRE_APPROVAL: ${{ vars.REQUIRE_APPROVAL || '1' }}
          # Recepcionista: responde no Telegram as mensagens de texto do Ramón
          # usando o Gemini Flash. Sem esta chave o robô degrada para o
          # comportamento antigo (só anota o recado) — não derruba o job.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python publisher/run.py

      # Placar do projeto: uma coleta por dia (o script sai sozinho se já coletou).
      # Nunca derruba o job — falha de métrica não pode impedir publicação.
      - name: Coletar métricas
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_BASE: ${{ vars.GRAPH_BASE || 'https://graph.instagram.com/v21.0' }}
        run: python publisher/metrics.py

      # Pauta da reunião estratégica de segunda (pedido do Ramón em 31/07/2026).
      # O script sai calado se não for segunda de manhã ou se já mandou a pauta
      # desta semana. Nunca derruba o job — reporte não pode travar publicação.
      - name: Pauta da reunião de segunda
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.forcar_reporte }}" = "true" ]; then
            python publisher/reporte_semanal.py --forcar
          else
            python publisher/reporte_semanal.py
          fi

      # Canal Claude -> Telegram: o token do bot só existe nos secrets, então
      # o recado que eu escrevo na conversa sai por aqui. Sem entrada `recado`,
      # o script sai calado. Nunca derruba o job.
      - name: Recado do Claude
        if: inputs.recado != ''
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RECADO: ${{ inputs.recado }}
        run: python publisher/mandar_recado.py

      # Avisa no Telegram quando o token do Instagram estiver a 7 dias ou menos
      # de vencer. Mora AQUI, e não no vigia local, de propósito: o notebook do
      # Ramón pode estar desligado justamente quando o aviso importa. Tem que
      # rodar ANTES do passo que commita, senão o marcador de "já avisei hoje"
      # nunca se salva e o aviso repete a cada 30 min.
      # O robô de domingo roda na máquina do Ramón, que não tem o token do bot.
      # Ele empurra o recado em content/aviso_lote.md e QUEM ENTREGA é este
      # passo, que tem os secrets. Assim o token existe num lugar só.
      - name: Entregar o recado do robô de domingo
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python publisher/avisar_lote.py

      - name: Avisar se o token do Instagram está para vencer
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_TOKEN_EXPIRA_EM: ${{ vars.IG_TOKEN_EXPIRA_EM }}
        run: python publisher/sentinel.py --token

      - name: Salvar estado da fila
        run: |
          git config user.name "hana-bot"
          git config user.email "hana-bot@users.noreply.github.com"
          git add content/
          git add publisher/.telegram_offset || true
          if git diff --cached --quiet; then
            echo "Nada mudou na fila."
            exit 0
          fi
          git commit -m "chore: atualiza estado da fila [skip ci]"
          # Corrida de push: se alguem (eu, o Ramon, outro runner) empurrou no
          # meio do ciclo, o push simples e REJEITADO e o robo perde o estado.
          # Aconteceu de verdade em 31/07/2026 20:43 — o job ficou vermelho e a
          # fila nao foi salva. Agora ele rebaseia e tenta de novo. Isso ficou
          # critico quando o .telegram_offset passou a ser versionado: perder o
          # push significa reprocessar as mensagens do Telegram na rodada
          # seguinte, chamando o Gemini de novo pelas mesmas mensagens.
          for tentativa in 1 2 3; do
            if git push; then
              echo "estado salvo (tentativa $tentativa)"
              exit 0
            fi
            echo "push rejeitado — rebaseando e tentando de novo ($tentativa/3)"
            git pull --rebase --autostash origin main || true
          done
          echo "::error::nao consegui salvar o estado da fila depois de 3 tentativas"
          exit 1

      # Falha alto se algum post falhou ou ficou vencido sem publicar.
      # Job vermelho => GitHub avisa por e-mail. Custo zero.
      - name: Sentinela
        if: always()
        run: python publisher/sentinel.py

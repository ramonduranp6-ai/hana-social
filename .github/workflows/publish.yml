name: Publicar posts da Hana

# Roda a cada 30 min: sincroniza aprovações, avisa pendentes e publica o que venceu.
# Também pode ser disparado na mão em Actions -> Run workflow.
on:
  schedule:
    # O cron do GitHub é BEST-EFFORT: em repositório público ele atrasa e às
    # vezes PULA rodadas sob carga. Medido em 31/07/2026 — quase 3 horas sem
    # nenhuma rodada agendada, e o post das 21:00Z só saiu porque houve um
    # disparo manual. Duas defesas:
    - cron: "*/30 * * * *"          # o batimento normal
    # e uma salva de tentativas coladas no horário de publicação. Se uma for
    # pulada, as outras cobrem. O run.py é idempotente: só publica o que está
    # 'approved' e venceu, então repetir a tentativa não duplica post.
    #
    # 21/08/2026 — a salva estava em 11:00Z, seg/qua/sex: era o reforço das 8h
    # de Itajaí. Em 19/08 o horário de publicação virou 11h de Itajaí = 14:00Z
    # (pico real medido na API) e ESTA LINHA NÃO FOI MOVIDA JUNTO — o reforço
    # passou a cair 3h antes da hora de publicar, ou seja, protegia um horário
    # que não existe mais. Movida para 14:00Z e para TODO DIA: a fila não roda
    # mais só seg/qua/sex, e o cron do GitHub é best-effort (medido nesta noite:
    # buracos de 30 a 56 min entre rodadas do batimento de 30 min).
    - cron: "0,7,14,21,28,35 14 * * *"
  workflow_dispatch:
    inputs:
      forcar_reporte:
        description: "Mandar a pauta da reunião agora, mesmo não sendo segunda"
        type: boolean
        default: false
      recado:
        description: "Recado do Claude pro Telegram do Ramón (deixe vazio pra não mandar nada)"
        type: string
        default: ""
      mostrar_fila:
        description: "Mandar a fila inteira no Telegram (mídia + legenda) pro Ramón assistir no celular"
        type: boolean
        default: false
      midia:
        description: "Caminho no repo de uma mídia avulsa (prévia/teste) pra mandar no Telegram"
        type: string
        default: ""
      midia_texto:
        description: "Legenda que acompanha a mídia avulsa"
        type: string
        default: ""
      assunto:
        description: "ASSUNTO da mensagem (etiqueta) — ex.: PREVIA DE REEL, TRILHA 10/08"
        type: string
        default: ""
      responda:
        description: "O que ele deve responder — ex.: APROVA ou NAO APROVA (vazio = não espera resposta)"
        type: string
        default: ""

# Permite que o job faça commit de volta (status dos posts, arquivamento).
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: hana-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-publisher.txt

      - name: Instalar dependências
        run: pip install -r requirements-publisher.txt

      - name: Rodar publicador
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_BASE: ${{ vars.GRAPH_BASE || 'https://graph.instagram.com/v21.0' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
          REQUIRE_APPROVAL: ${{ vars.REQUIRE_APPROVAL || '1' }}
          # Recepcionista: responde no Telegram as mensagens de texto do Ramón
          # usando o Gemini Flash. Sem esta chave o robô degrada para o
          # comportamento antigo (só anota o recado) — não derruba o job.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python publisher/run.py

      # Canal Claude -> Telegram: o token do bot só existe nos secrets, então
      # o recado que eu escrevo na conversa sai por aqui. Sem entrada `recado`,
      # o script sai calado. Nunca derruba o job.
      - name: Recado do Claude
        if: inputs.recado != ''
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RECADO: ${{ inputs.recado }}
          RECADO_ASSUNTO: ${{ inputs.assunto }}
          RECADO_RESPONDA: ${{ inputs.responda }}
        run: python publisher/mandar_recado.py

      # "Me traga elas aqui, com vídeo/foto e descrição. Quero assistir pelo
      # celular" (pedido dele em 01/08/2026). O notify_pending só manda post
      # `pending` e só uma vez — os aprovados ele nunca reveria. Este passo é o
      # "me mostra de novo": só leitura, não muda status de nada.
      - name: Mostrar a fila no Telegram
        if: inputs.mostrar_fila
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
        run: python publisher/mostrar_fila.py

      # Prévia/teste avulso no Telegram. "Eu vi pelo telegram, muito melhor
      # olhar por lá" (ele, 01/08/2026). Manda o arquivo por upload, não por
      # URL. Sem a entrada `midia`, o passo nem roda.
      - name: Mandar midia avulsa no Telegram
        if: inputs.midia != ''
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIDIA: ${{ inputs.midia }}
          MIDIA_TEXTO: ${{ inputs.midia_texto }}
          MIDIA_ASSUNTO: ${{ inputs.assunto }}
          MIDIA_RESPONDA: ${{ inputs.responda }}
        run: python publisher/mandar_midia.py

      # Falha alto se algum post falhou ou ficou vencido sem publicar.
      # Job vermelho => GitHub avisa por e-mail. Custo zero.
      #
      # PRECISA rodar ANTES de "Salvar estado da fila": o sentinela grava seu
      # marcador de "já avisei hoje" em content/.falhas_avisadas.json, e só o
      # passo seguinte de fato dá commit/push em content/. Achado 26/08/2026:
      # com a ordem invertida (sentinela DEPOIS do commit), o marcador nunca
      # era salvo — cada rodada nascia "cega" de novo e o alarme de fila vazia
      # (ou de post failed) reabria a CADA execução (a cada 30 min), nunca só
      # 1x por dia como o dedupe pretendia. Sem `continue-on-error`: um step
      # que falha ainda marca o job inteiro como "failure" (GitHub ainda avisa
      # por e-mail) desde que os passos seguintes usem `if: always()` — não
      # precisa rodar o sentinela de novo depois para "confirmar" a cor.
      - name: Sentinela
        if: always()
        run: python publisher/sentinel.py

      - name: Salvar estado da fila
        if: always()
        run: |
          git config user.name "hana-bot"
          git config user.email "hana-bot@users.noreply.github.com"
          git add content/
          git add publisher/.telegram_offset || true
          if git diff --cached --quiet; then
            echo "Nada mudou na fila."
            exit 0
          fi
          git commit -m "chore: atualiza estado da fila [skip ci]"
          # Corrida de push: se alguem (eu, o Ramon, outro runner) empurrou no
          # meio do ciclo, o push simples e REJEITADO e o robo perde o estado.
          # Aconteceu de verdade em 31/07/2026 20:43 — o job ficou vermelho e a
          # fila nao foi salva. Agora ele rebaseia e tenta de novo. Isso ficou
          # critico quando o .telegram_offset passou a ser versionado: perder o
          # push significa reprocessar as mensagens do Telegram na rodada
          # seguinte, chamando o Gemini de novo pelas mesmas mensagens.
          for tentativa in 1 2 3; do
            if git push; then
              echo "estado salvo (tentativa $tentativa)"
              exit 0
            fi
            echo "push rejeitado — rebaseando e tentando de novo ($tentativa/3)"
            git pull --rebase --autostash origin main || true
          done
          echo "::error::nao consegui salvar o estado da fila depois de 3 tentativas"
          exit 1

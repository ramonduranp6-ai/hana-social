name: Manutenção diária da Hana

on:
  schedule:
    - cron: "15 12 * * *"
  workflow_dispatch:
    inputs:
      forcar_reporte:
        description: "Mandar a pauta semanal agora"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    concurrency:
      group: hana-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-publisher.txt
      - run: pip install -r requirements-publisher.txt
      - name: Métricas, diagnóstico e leitura D+1
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_BASE: ${{ vars.GRAPH_BASE || 'https://graph.instagram.com/v21.0' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python publisher/metrics.py
          python publisher/diagnostico.py --registrar-se-enviado
          python publisher/leitura_d1.py
          python publisher/avisar_lote.py
      - name: Cobertura da fila e token
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_TOKEN_EXPIRA_EM: ${{ vars.IG_TOKEN_EXPIRA_EM }}
        run: |
          python publisher/cobertura_fila.py --notificar
          python publisher/sentinel.py --token
      - name: Pauta semanal
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.forcar_reporte }}" = "true" ]; then python publisher/reporte_semanal.py --forcar; else python publisher/reporte_semanal.py; fi
      - name: Salvar estado
        run: |
          git config user.name "hana-bot"
          git config user.email "hana-bot@users.noreply.github.com"
          git add content/ publisher/.telegram_offset || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: atualiza manutenção [skip ci]"
          git push
